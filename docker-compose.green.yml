version: '3.8'

services:
  app-green:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: couponmoa-green
    ports:
      - "8082:8080"
    depends_on:
      - redis
      - mysql
    environment:
      SPRING_REDIS_HOST: redis
      SPRING_REDIS_PORT: 6379
      SPRING_DATASOURCE_URL: jdbc:mysql://mysql:3306/couponmoa
      SPRING_DATASOURCE_USERNAME: root
      SPRING_DATASOURCE_PASSWORD: 1234
    networks:
      - couponmoa-net

  redis:
    image: redis:7.2
    container_name: redis
    ports:
      - "6380:6379"
    networks:
      - couponmoa-net

  mysql:
    image: mysql:8.0
    container_name: mysql
    ports:
      - "3307:3306"
    environment:
      MYSQL_ROOT_PASSWORD: 1234
      MYSQL_DATABASE: couponmoa
    volumes:
      - mysql-data:/var/lib/mysql
    networks:
      - couponmoa-net

volumes:
  mysql-data:

networks:
  couponmoa-net:
