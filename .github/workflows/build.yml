name: Build and Deploy

on:
  push:
    branches: [ dev ]
  pull_request:
    branches: [ dev ]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout source code
        uses: actions/checkout@v3

      - name: Set up JDK 17
        uses: actions/setup-java@v3
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Grant execute permission for gradlew
        run: chmod +x ./gradlew

      - name: Restore application.yml
        run: echo "${{ secrets.APPLICATION_YML }}" > src/main/resources/application.yml

      - name: Restore application-local.properties
        run: echo "${{ secrets.APPLICATION_LOCAL_PROPERTIES }}" > src/main/resources/application-local.properties

      - name: Build with Gradle
        run: ./gradlew clean build -x test

      - name: Create deploy.zip
        run: |
          mkdir -p deploy
          cp ./appspec.yml ./deploy/
          cp ./Dockerfile ./deploy/
          cp ./docker-compose.yml ./deploy/
          cp ./build/libs/*.jar ./deploy/
          cp ./deploy.sh ./deploy/
          zip -r -qq -j ./deploy.zip ./deploy
          
      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v1
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ secrets.AWS_REGION }}

      - name: Upload to S3
        run: |
          aws s3 cp \
            ./deploy.zip s3://couponmoa-test1/deploy.zip \
            --region ap-northeast-2
      - name: Deploy with CodeDeploy
        run: |
          aws deploy create-deployment \
            --application-name test-app \
            --deployment-group-name test-app \
            --deployment-config-name CodeDeployDefault.AllAtOnce \
            --s3-location bucket=couponmoa-test1,bundleType=zip,key=deploy.zip
